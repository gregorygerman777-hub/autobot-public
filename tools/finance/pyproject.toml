[project]
name = "rocketmoney-cli"
version = "0.1.0"
description = "CLI scraper for RocketMoney financial data"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.50",
    "httpx>=0.28",
    "playwright-stealth>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rocketmoney_cli"]
