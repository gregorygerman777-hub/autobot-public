[project]
name = "prime-intellect-cli"
version = "0.1.0"
description = "CLI for Prime Intellect GPU compute management"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prime_intellect"]
