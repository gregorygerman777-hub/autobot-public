name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  autobot-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Submodules are private/optional and not needed for these tests.
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run test suite
        run: ./scripts/run-tests.sh

      - name: Lint
        run: |
          pipx install ruff || pip install ruff
          ruff check autobot_core tests

      - name: Verify action registry is loadable
        run: |
          PYTHONPATH=. python -m autobot_core.cli registry > /dev/null
          echo "registry OK"
