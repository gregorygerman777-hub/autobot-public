name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  autobot-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Submodules are optional and not needed for these tests.
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unit tests
        run: ./scripts/run-tests.sh

      - name: Evaluation harness
        # Gates on accuracy rather than only on the tests passing, so a prompt
        # or rule change that degrades triage quality fails CI even when nothing
        # throws. --no-record keeps CI from writing history rows; the committed
        # history is for real runs.
        run: ./scripts/run-evals.sh --fail-under 1.0 --no-record

      - name: Lint
        run: |
          pipx install ruff || pip install ruff
          ruff check autobot_core tests evals

      - name: Verify CLI surface
        run: |
          PYTHONPATH=. python -m autobot_core.cli registry > /dev/null
          PYTHONPATH=. python -m autobot_core.cli memory-status --root /tmp/nonexistent > /dev/null
          echo "CLI OK"

      - name: Verify shell scripts parse
        run: |
          for f in scripts/*.sh autobot; do bash -n "$f" || exit 1; done
          echo "shell OK"
